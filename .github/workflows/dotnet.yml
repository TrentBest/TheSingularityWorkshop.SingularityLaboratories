name: .NET

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out FSM_Execution workflow contracts
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_Execution
          ref: development
          path: dependencies/FSM_Execution
      - name: Check out FSM_COS composition source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: development
          path: dependencies/FSM_COS
      - name: Check out FSM_API source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/FSM_API
          ref: development
          path: dependencies/FSM_API
      - name: Check out FSM_UserIO source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_UserIO
          ref: development
          path: dependencies/FSM_UserIO
      - name: Check out Physics model source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.Physics
          ref: development
          path: dependencies/Physics
      - name: Check out MicroBundleDomain contracts
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: master
          path: dependencies/TheSingularityWorkshop.MicroBundleDomain
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test the selected Physics experiment
        run: dotnet test dependencies/Physics/tests/TheSingularityWorkshop.Physics.Tests/TheSingularityWorkshop.Physics.Tests.csproj --configuration Release --filter FullyQualifiedName~ElectricalThermalCouplingExperimentTests
      - name: Test laboratory domain contracts and adapters
        run: dotnet test tests/SingularityLaboratories.Tests/SingularityLaboratories.Tests.csproj --configuration Release
      - name: Build FSM_Execution workflow adapter
        run: dotnet build src/Laboratory.ExecutionAdapter/Laboratory.ExecutionAdapter.csproj --configuration Release
      - name: Build Physics adapter
        run: dotnet build src/Laboratory.PhysicsAdapter/Laboratory.PhysicsAdapter.csproj --configuration Release
      - name: Build laboratory MicroBundle adapter
        run: dotnet build src/Laboratory.MicroBundleAdapter/Laboratory.MicroBundleAdapter.csproj --configuration Release
