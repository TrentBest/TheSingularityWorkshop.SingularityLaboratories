<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Singularity Laboratories domain map</title>
<desc id="desc">Trusted hosts surround a portable laboratory domain. Physics supplies scientific models, FSM Execution owns workflow lifecycle, FSM COS composes experiences, and presentation systems render views. The laboratory domain binds definitions, instruments, configurations, campaigns, and evidence without taking ownership of those neighboring systems.</desc>
<defs>
 <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16485a"/><stop offset="1" stop-color="#102536"/></linearGradient>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#83e2c2"/></marker>
 <style>
 .box{fill:#10202e;stroke:#3c6477;stroke-width:2}.lab{fill:url(#lab);stroke:#83e2c2;stroke-width:4}.t{fill:#edf6fb;font:700 22px system-ui,sans-serif}.s{fill:#a9bdca;font:15px system-ui,sans-serif}.a{fill:none;stroke:#83e2c2;stroke-width:3;marker-end:url(#arr)}.d{fill:none;stroke:#f0c77b;stroke-width:2;stroke-dasharray:8 7}.pulse{fill:#f0c77b}
 @media(prefers-reduced-motion:reduce){.pulse{display:none}}
 </style>
</defs>
<rect width="1200" height="680" rx="24" fill="#07111d"/>
<rect class="box" x="35" y="35" width="1130" height="92" rx="16"/>
<text class="t" x="600" y="75" text-anchor="middle">Trusted host / institution</text>
<text class="s" x="600" y="103" text-anchor="middle">Identity · authorization · tenancy · scheduling · billing · enforcement · physical access</text>
<path class="a" d="M600 127V177"/>
<rect class="lab" x="300" y="180" width="600" height="300" rx="22"/>
<text class="t" x="600" y="220" text-anchor="middle">SINGULARITY LABORATORIES</text>
<text class="s" x="600" y="248" text-anchor="middle">Portable scientific identity and research provenance</text>
<g>
 <rect class="box" x="335" y="280" width="250" height="72" rx="12"/><text class="t" x="460" y="310" text-anchor="middle">Definitions</text><text class="s" x="460" y="334" text-anchor="middle">Lab · experiment · instrument</text>
 <rect class="box" x="615" y="280" width="250" height="72" rx="12"/><text class="t" x="740" y="310" text-anchor="middle">Investigation</text><text class="s" x="740" y="334" text-anchor="middle">Method · configuration · campaign</text>
 <rect class="box" x="335" y="380" width="250" height="72" rx="12"/><text class="t" x="460" y="410" text-anchor="middle">Execution record</text><text class="s" x="460" y="434" text-anchor="middle">Run · outcome · replay lineage</text>
 <rect class="box" x="615" y="380" width="250" height="72" rx="12"/><text class="t" x="740" y="410" text-anchor="middle">Evidence</text><text class="s" x="740" y="434" text-anchor="middle">Measurement · provenance · review</text>
</g>
<path class="a" d="M300 330H230V280H190"/><path class="a" d="M900 330H970V280H1010"/>
<rect class="box" x="35" y="225" width="155" height="110" rx="14"/><text class="t" x="112" y="267" text-anchor="middle">Physics</text><text class="s" x="112" y="294" text-anchor="middle">Models +</text><text class="s" x="112" y="315" text-anchor="middle">numerics</text>
<rect class="box" x="1010" y="225" width="155" height="110" rx="14"/><text class="t" x="1087" y="267" text-anchor="middle">FSM_Execution</text><text class="s" x="1087" y="294" text-anchor="middle">Workflow</text><text class="s" x="1087" y="315" text-anchor="middle">lifecycle</text>
<path class="a" d="M460 480V525H270V565"/><path class="a" d="M740 480V525H930V565"/>
<rect class="box" x="130" y="565" width="280" height="78" rx="14"/><text class="t" x="270" y="597" text-anchor="middle">FSM_COS</text><text class="s" x="270" y="621" text-anchor="middle">Experience composition</text>
<rect class="box" x="790" y="565" width="280" height="78" rx="14"/><text class="t" x="930" y="597" text-anchor="middle">Renderer / Visualize</text><text class="s" x="930" y="621" text-anchor="middle">Presentation and observation</text>
<path class="d" d="M410 604H790"/>
<circle class="pulse" r="7"><animateMotion dur="6s" repeatCount="indefinite" path="M190 280H230V330H300H900H970V280H1010"/></circle>
</svg>