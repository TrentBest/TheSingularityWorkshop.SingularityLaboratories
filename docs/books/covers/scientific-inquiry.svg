<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Inquiry</title>
  <desc id="desc">A branching network of observation, experiment, evidence, and explanation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2b"/>
      <stop offset="1" stop-color="#243d55"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f4d58d" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f4d58d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="960" fill="url(#bg)"/>
  <circle cx="360" cy="430" r="250" fill="url(#glow)" opacity=".55"/>
  <g fill="none" stroke="#d6e4ef" stroke-opacity=".72" stroke-width="3">
    <path d="M360 430 180 270 92 180M360 430 540 270 628 180M360 430 180 590 92 680M360 430 540 590 628 680"/>
    <path d="M180 270 360 130 540 270M180 590 360 750 540 590"/>
    <path d="M92 180 180 110M628 180 540 110M92 680 180 750M628 680 540 750"/>
    <circle cx="360" cy="430" r="78" stroke="#f4d58d" stroke-width="5"/>
    <circle cx="180" cy="270" r="28"/><circle cx="540" cy="270" r="28"/>
    <circle cx="180" cy="590" r="28"/><circle cx="540" cy="590" r="28"/>
    <circle cx="360" cy="130" r="20"/><circle cx="360" cy="750" r="20"/>
  </g>
  <g fill="#f4d58d">
    <circle cx="360" cy="430" r="12"/><circle cx="180" cy="270" r="8"/>
    <circle cx="540" cy="270" r="8"/><circle cx="180" cy="590" r="8"/>
    <circle cx="540" cy="590" r="8"/>
  </g>
  <g fill="#eef4f8" font-family="Georgia,serif" text-anchor="middle">
    <text x="360" y="840" font-size="54" letter-spacing="3">SCIENTIFIC</text>
    <text x="360" y="900" font-size="54" letter-spacing="3">INQUIRY</text>
  </g>
</svg>